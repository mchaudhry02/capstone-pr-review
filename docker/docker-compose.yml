services:
  agent-harness:
    build: .
    container_name: pr-review-agent
    volumes:
      # Mount the whole repo (one level up from docker/) so the container
      # sees orchestrator.py, agents/, skills/, mcp/, data/, etc. live -
      # edits on your host machine show up immediately, no rebuild needed.
      - ..:/workspace
    environment:
      # Loaded from .env - never commit real secrets
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    # No open network by default beyond what the base image needs.
    # If you want to explicitly restrict egress further, that's usually
    # done at the host/firewall level or with a custom Docker network -
    # document this as a known boundary in your architecture write-up.
    network_mode: "bridge"
    read_only: false   # set true later once you confirm what needs write access
    tty: true
    stdin_open: true